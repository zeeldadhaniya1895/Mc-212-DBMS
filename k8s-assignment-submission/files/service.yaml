apiVersion: v1
kind: Service
metadata:
  name: campusconnect
spec:
  type: NodePort
  selector:
    app: campusconnect
  ports:
    - protocol: TCP
      port: 80          # the Service's port inside the cluster
      targetPort: 8000  # the port inside the container (Flask)
      nodePort: 30080   # the port opened on the nodes -> localhost:30080
